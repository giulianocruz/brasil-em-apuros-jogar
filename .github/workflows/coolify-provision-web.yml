name: Instalar ou atualizar Brasil em Apuros no Coolify
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect só consulta; provision cria se ausente; redeploy atualiza existente'
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - provision
          - redeploy

permissions:
  contents: read

concurrency:
  group: brasil-em-apuros-coolify-bootstrap
  cancel-in-progress: false

jobs:
  coolify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_ACTION: ${{ inputs.action }}
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_ENVIRONMENT_NAME: ${{ vars.COOLIFY_ENVIRONMENT_NAME }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e segurança sem acessar o Coolify
        run: |
          node --check tools/coolify-provision-vps.mjs
          node --test tools/coolify-provision-vps.test.mjs
      - name: Aplicar somente a ação selecionada
        run: node tools/coolify-provision-vps.mjs
