server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # O proxy HTTPS/TLS permanece a cargo do Coolify/Traefik.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Godot usa Service Workers por edição para unir os segmentos .pck.
    # Não servir HTML ou SW obsoleto após o deploy.
    location ~ /(?:index\.html|pack-sw\.js|pack-manifest\.json)$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # O WebAssembly exige o MIME correto; não adicionar compressão
    # ou cabeçalhos CORS/COEP sem testar em aparelhos reais.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~ \.pck\.part[0-9]+$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    autoindex off;
}
